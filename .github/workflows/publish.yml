# Publishes thesanjosesource.com from this repo.
# Every push to main waits for Jay's approval (environment "production",
# required reviewer: knightingale408). After approval it publishes ALL site
# files to here.now and checks the live site matches the repo byte for byte.
# After that publish succeeds, it runs the same Lychee check as link-check.yml
# against the live pages. This file stops before building or uploading unless
# github.sha is the current origin/main HEAD. A re-run of an older commit
# still uses the workflow file stored in that commit.
name: Publish site

on:
  push:
    branches: [main]
    # Workflow-only and repo-only files. A change to publish.yml itself still
    # triggers a run, so a change to publish behavior gets one validation
    # republish. check_links.py is excluded from the site upload.
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "tools/**"
      - "research/**"
      - "check_links.py"
      - ".github/workflows/agenda-pull.yml"
      - ".github/workflows/link-check.yml"
      - ".github/workflows/build-check.yml"
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  on-current-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stop unless github.sha is current origin/main
        run: |
          set -eu
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          this_sha="${{ github.sha }}"
          echo "github.sha=${this_sha}"
          echo "origin/main=${main_sha}"
          if [ "${this_sha}" != "${main_sha}" ]; then
            echo "::error::Refusing to publish. github.sha (${this_sha}) is not the current origin/main HEAD (${main_sha})."
            exit 1
          fi

  publish:
    needs: on-current-main
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://thesanjosesource.com/
    steps:
      - uses: actions/checkout@v5
      - name: Stop unless github.sha is still current origin/main
        run: |
          set -eu
          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          this_sha="${{ github.sha }}"
          echo "github.sha=${this_sha}"
          echo "origin/main=${main_sha}"
          if [ "${this_sha}" != "${main_sha}" ]; then
            echo "::error::Refusing to publish. github.sha (${this_sha}) is not the current origin/main HEAD (${main_sha})."
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build brief pages from content/
        run: python3 build.py
      - name: Publish ALL files to here.now and verify live = repo
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
        run: python3 .github/scripts/publish.py
      - name: List published pages for the link check
        if: success()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("sitemap.xml").getroot()
          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          locs = [el.text.strip() for el in root.iter(f"{ns}loc") if el.text and el.text.strip()]
          if not locs:
              raise SystemExit("sitemap.xml has no URLs to check")
          Path("live-pages.txt").write_text("\n".join(locs) + "\n", encoding="utf-8")
          print("Live pages:")
          print("\n".join(locs))
          PY
      - name: Check links on the live site
        if: success()
        uses: lycheeverse/lychee-action@v2
        with:
          # Same checker, accept list, retries and timeout as link-check.yml.
          # Concurrency is capped at 4: Legistar/Granicus starts refusing
          # requests (as 404s) when lychee's default 128 parallel requests
          # hit it, which failed run #29 on links that are actually fine.
          # Inputs are the live page URLs from the sitemap just published,
          # so Lychee fetches those pages and checks the links on them.
          args: >-
            --no-progress
            --accept 200..=299,403,429
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --files-from ${{ github.workspace }}/live-pages.txt
          fail: true
